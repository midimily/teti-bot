<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teti Desktop</title>
    <style>
      .teti-boot-fallback {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        gap: 10px;
        padding: 28px;
        border: 1px solid rgba(43, 135, 217, 0.18);
        border-radius: 24px;
        background: #edf8ff;
        color: #102d4f;
        font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .teti-boot-fallback strong { font-size: 20px; }
      .teti-boot-fallback small { color: rgba(25, 62, 101, 0.68); }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite" data-teti-boot-stage="html">
      <section class="teti-boot-fallback" data-teti-boot>
        <strong>Teti</strong>
        <span data-teti-boot-message>正在启动 / Starting…</span>
        <small data-teti-boot-code>BOOT-HTML</small>
      </section>
    </main>
    <script>
      (() => {
        const root = document.getElementById("app");
        const showFailure = (stage) => {
          const fallback = root?.querySelector("[data-teti-boot]");
          if (!fallback) return;
          const message = fallback.querySelector("[data-teti-boot-message]");
          const code = fallback.querySelector("[data-teti-boot-code]");
          if (message) message.textContent = "启动未完成，请重新启动 Teti / Startup did not complete";
          if (code) code.textContent = `BOOT-${String(stage).toUpperCase()}`;
        };
        window.addEventListener("error", () => showFailure("module"));
        window.addEventListener("unhandledrejection", () => showFailure("promise"));
        window.setTimeout(() => showFailure(root?.dataset.tetiBootStage ?? "timeout"), 15_000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
